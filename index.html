<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #141419;
      --bg-input: #1e1e26;
      --accent-blue: #0a84ff;
      --accent-hover: #0070e0;
      --accent-glow: rgba(10, 132, 255, 0.4);
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 60px 16px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Cabeçalho Oficial */
    .title-box {
      text-align: center;
      margin-bottom: 2px;
    }

    .title-box h1 {
      font-size: 1.95rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .title-box p {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    /* Barra de entrada de link */
    .input-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      height: 52px;
      padding: 0 18px;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      color: #111111;
      font-size: 16px;
      font-weight: 500;
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 0 3px var(--accent-blue);
    }

    input[type="text"]::placeholder {
      color: #888888;
    }

    /* Botão azul Reproduzir */
    .btn-reproduzir {
      width: 100%;
      height: 48px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(10, 132, 255, 0.35);
    }

    .btn-reproduzir:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 22px var(--accent-glow);
    }

    .btn-reproduzir:active {
      transform: scale(0.99);
    }

    /* Ações rápidas */
    .action-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 2px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Moldura do Vídeo com Escudos de Proteção */
    .player-card {
      width: 100%;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 6px;
      position: relative;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
      overflow: hidden;
    }

    .video-viewport iframe,
    .video-viewport video,
    #playerSlot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* ESCUDO 1: Bloqueador da barra superior (impede clicar no título ou canal) */
    .shield-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 56px;
      z-index: 25;
      background: transparent;
      pointer-events: auto;
      cursor: default;
    }

    /* ESCUDO 2: Bloqueador do canto inferior direito (cobre 'Mais vídeos' e logo 'YouTube') */
    .shield-bottom-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 260px;
      height: 48px;
      z-index: 25;
      background: #000000;
      pointer-events: auto;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 14px;
    }

    /* Botão nativo e limpo de Tela Cheia dentro do escudo */
    .btn-fs {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-fs:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Detalhes da Música: APENAS CANTOR E NOME DA MÚSICA */
    .meta-card {
      padding: 24px 28px;
      background: linear-gradient(180deg, #131318 0%, #0c0c0f 100%);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-tag {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-artist {
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .meta-track {
      font-size: 1.15rem;
      font-weight: 500;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-year {
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      color: #e4e4e7;
    }

    /* Tela inicial antes de tocar */
    .placeholder-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #71717a;
      gap: 14px;
      background: #09090c;
      z-index: 10;
    }

    .placeholder-screen svg {
      width: 60px;
      height: 60px;
      fill: #27272a;
    }

    .placeholder-screen p {
      font-size: 15px;
    }

    /* Histórico recente */
    .history-card {
      width: 100%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 10px;
      display: none;
    }

    .history-header {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      list-style: none;
    }

    .history-item {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: background 0.15s ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.08);
    }

    .history-artist {
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .history-track {
      font-size: 13px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Cabeçalho Oficial -->
  <div class="title-box">
    <h1>Player YouTube - Cole o link abaixo</h1>
    <p>Toque qualquer link do YouTube • Exibindo somente o Cantor e a Música</p>
  </div>

  <!-- Campo para colar qualquer link -->
  <div class="input-section">
    <div class="input-row">
      <input 
        type="text" 
        id="linkInput" 
        placeholder="Cole qualquer link do YouTube aqui (ex: https://www.youtube.com/watch?v=...)"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- Botão azul Reproduzir -->
    <button class="btn-reproduzir" id="btnPlay">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Reproduzir
    </button>

    <div class="action-chips">
      <span class="chip" id="chipPaste">📋 Colar Link</span>
      <span class="chip" id="chipClear">✖ Limpar</span>
    </div>
  </div>

  <!-- Player Principal de Vídeo com Escudos de Proteção -->
  <div class="player-card">
    <div class="video-viewport" id="viewport">
      
      <!-- Slot onde o iframe ou vídeo é inserido -->
      <div id="playerSlot"></div>

      <!-- Escudo Superior (Impede clicar no título ou canal do YouTube) -->
      <div class="shield-top" id="shieldTop"></div>

      <!-- Escudo Inferior Direito (Cobre 'Mais vídeos' e logo 'YouTube') -->
      <div class="shield-bottom-right" id="shieldBottom">
        <button class="btn-fs" id="btnFs" type="button">⛶ Tela Cheia</button>
      </div>

      <!-- Placeholder inicial -->
      <div class="placeholder-screen" id="placeholder">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        <p>Cole um link do YouTube acima e clique em Reproduzir</p>
      </div>
    </div>

    <!-- Metadados: SOMENTE CANTOR E MÚSICA (CANAL DO CRIADOR NUNCA É EXIBIDO) -->
    <div class="meta-card" id="metaCard" style="display: none;">
      <div class="meta-tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Cantor / Artista
      </div>
      <div class="meta-artist" id="artistDisplay">-</div>
      <div class="meta-track">
        <span id="trackDisplay">-</span>
        <span class="meta-year" id="yearDisplay" style="display: none;">-</span>
      </div>
    </div>
  </div>

  <!-- Histórico das últimas tocadas -->
  <div class="history-card" id="historyCard">
    <div class="history-header">
      <span>🕒 Músicas tocadas recentemente</span>
      <span style="font-size: 12px; cursor: pointer; color: var(--accent-blue);" id="clearHistory">Limpar histórico</span>
    </div>
    <ul class="history-list" id="historyList"></ul>
  </div>

</div>

<!-- Biblioteca HLS para caso cole links diretos (.m3u8) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
  const linkInput = document.getElementById('linkInput');
  const btnPlay = document.getElementById('btnPlay');
  const chipPaste = document.getElementById('chipPaste');
  const chipClear = document.getElementById('chipClear');

  const viewport = document.getElementById('viewport');
  const playerSlot = document.getElementById('playerSlot');
  const placeholder = document.getElementById('placeholder');
  const metaCard = document.getElementById('metaCard');
  const artistDisplay = document.getElementById('artistDisplay');
  const trackDisplay = document.getElementById('trackDisplay');
  const yearDisplay = document.getElementById('yearDisplay');
  const btnFs = document.getElementById('btnFs');

  const historyCard = document.getElementById('historyCard');
  const historyList = document.getElementById('historyList');
  const clearHistory = document.getElementById('clearHistory');

  // Controle de Tela Cheia Nativo
  btnFs.onclick = () => {
    if (!document.fullscreenElement) {
      if (viewport.requestFullscreen) viewport.requestFullscreen();
      else if (viewport.webkitRequestFullscreen) viewport.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  };

  // Extrai com precisão o ID do vídeo de QUALQUER formato de link do YouTube
  function extractYouTubeId(url) {
    if (!url) return null;
    const str = url.trim();

    // 1. Caso com parâmetro v= (ex: youtube.com/watch?v=... com ou sem &list=...)
    const vMatch = str.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (vMatch) return vMatch[1];

    // 2. Caso youtu.be/ID
    const beMatch = str.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (beMatch) return beMatch[1];

    // 3. Caso embed/ID ou shorts/ID ou /v/ID
    const embMatch = str.match(/(?:embed|shorts|\/v\/)([a-zA-Z0-9_-]{11})/);
    if (embMatch) return embMatch[1];

    // 4. Se já for apenas o ID de 11 caracteres
    if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;

    return null;
  }

  // Limpa o título bruto e extrai SOMENTE o Cantor e a Música
  function parseArtistAndSong(rawTitle) {
    let title = (rawTitle || '').trim();

    // Remove emojis e símbolos comuns
    title = title.replace(/^[\s\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}🎵🎶🎧🔥✨🌟🖤❤️🚂]+/gu, '').trim();
    title = title.replace(/[\s\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}🎵🎶🎧🔥✨🌟🖤❤️🚂]+$/gu, '').trim();
    title = title.replace(/^[“"']+|[”"']+$/g, '').trim();

    let artist = '';
    let track = '';
    let year = '';

    // Extrai ano se houver (ex: 1977, 1983, 2024)
    const yearMatch = title.match(/\b(19\d\d|20\d\d)\b/);
    if (yearMatch) year = yearMatch[1];

    // Padrões de separação
    const byMatch = title.match(/^(.+?)\s+by\s+(.+)$/i);
    const dotMatch = title.match(/^(.+?)\s+[·•]\s+(.+)$/);
    const dashMatch = title.match(/^(.+?)\s+[-–—]\s+(.+)$/);

    if (byMatch) {
      track = byMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      artist = byMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else if (dotMatch) {
      track = dotMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      artist = dotMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else if (dashMatch) {
      artist = dashMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      track = dashMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else {
      track = title;
      artist = 'Cantor / Artista';
    }

    // Limpeza final do Cantor
    artist = artist.replace(/^by\s+/i, '').trim();
    artist = artist.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}]/gu, '').trim();
    artist = artist.replace(/^[“"']+|[”"']+$/g, '').trim();

    // Limpeza final da Música
    track = track.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}]/gu, '').trim();
    track = track.replace(/\b(4K|RARE|HD|HQ|REMASTERED|OFFICIAL VIDEO|CLIPE OFICIAL|VÍDEO OFICIAL)\b/gi, '').trim();
    track = track.replace(/^[“"']+|[”"']+$/g, '').trim();

    return { artist, track, year };
  }

  // Histórico local
  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem('pyt_history') || '[]');
    } catch (e) {
      return [];
    }
  }

  function saveToHistory(artist, track, url) {
    let hist = getHistory().filter(h => h.url !== url);
    hist.unshift({ artist, track, url });
    if (hist.length > 10) hist = hist.slice(0, 10);
    localStorage.setItem('pyt_history', JSON.stringify(hist));
    renderHistory();
  }

  function renderHistory() {
    const hist = getHistory();
    if (hist.length === 0) {
      historyCard.style.display = 'none';
      return;
    }
    historyCard.style.display = 'block';
    historyList.innerHTML = '';
    hist.forEach(item => {
      const li = document.createElement('li');
      li.className = 'history-item';
      li.innerHTML = `
        <div>
          <div class="history-artist">${item.artist}</div>
          <div class="history-track">${item.track}</div>
        </div>
        <span style="font-size: 13px; color: var(--accent-blue);">▶ Tocar</span>
      `;
      li.onclick = () => {
        linkInput.value = item.url;
        reproduzir(item.url);
      };
      historyList.appendChild(li);
    });
  }

  // Função principal para reproduzir QUALQUER link fornecido
  async function reproduzir(url) {
    if (!url || !url.trim()) {
      alert('Por favor, cole um link válido antes de clicar em Reproduzir.');
      return;
    }

    const cleanUrl = url.trim();
    const ytId = extractYouTubeId(cleanUrl);

    if (ytId) {
      // Oculta placeholder inicial
      if (placeholder) placeholder.style.display = 'none';

      // 1. Injeta o iframe oficial com sandbox rígido (bloqueia abrir nova aba do YouTube)
      playerSlot.innerHTML = `
        <iframe 
          src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1" 
          width="100%" 
          height="100%" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin"
          sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
          allowfullscreen>
        </iframe>
      `;

      // Atualiza o display indicando busca dos dados
      metaCard.style.display = 'flex';
      artistDisplay.textContent = 'Carregando cantor...';
      trackDisplay.textContent = 'Carregando música...';
      yearDisplay.style.display = 'none';

      // 2. Busca os dados via oEmbed / NoEmbed (CRIADOR DO CANAL É IGNORADO!)
      try {
        const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
        if (response.ok) {
          const data = await response.json();
          if (data && data.title) {
            const info = parseArtistAndSong(data.title);
            artistDisplay.textContent = info.artist || 'Música';
            trackDisplay.textContent = info.track || data.title;
            if (info.year) {
              yearDisplay.textContent = info.year;
              yearDisplay.style.display = 'inline-block';
            } else {
              yearDisplay.style.display = 'none';
            }
            saveToHistory(info.artist, info.track, cleanUrl);
            return;
          }
        }
      } catch (err) {
        console.warn('Erro ao consultar dados da música:', err);
      }

      // Se falhar a busca do nome, exibe identificação básica
      artistDisplay.textContent = 'Música do YouTube';
      trackDisplay.textContent = 'Vídeo ID: ' + ytId;
      yearDisplay.style.display = 'none';
      saveToHistory('Música do YouTube', 'Vídeo ID: ' + ytId, cleanUrl);

    } else if (cleanUrl.includes('.m3u8')) {
      if (placeholder) placeholder.style.display = 'none';
      playerSlot.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;height:100%;"></video>';
      const video = document.getElementById('videoPlayer');

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(cleanUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = cleanUrl;
      }

      metaCard.style.display = 'flex';
      artistDisplay.textConte
