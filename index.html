
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player YouTube</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #000000;
      --bg-card: #0d0d11;
      --accent-blue: #0a84ff;
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Moldura Principal do Vídeo */
    .player-card {
      width: 100%;
      background: #000000;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
      overflow: hidden;
    }

    .video-viewport iframe,
    .video-viewport video,
    #playerSlot {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* ESCUDO SUPERIOR: Bloqueia cliques no título e foto do canal */
    .shield-top {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 58px;
      z-index: 25;
      background: transparent;
      pointer-events: auto;
      cursor: default;
    }

    /* ESCUDO INFERIOR DIREITO: Cobre e bloqueia 'Mais vídeos' e o logo do YouTube */
    .shield-bottom-right {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 260px;
      height: 50px;
      z-index: 25;
      background: #000000;
      pointer-events: auto;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 14px;
    }

    /* Botão nativo limpo de Tela Cheia */
    .btn-fs {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .btn-fs:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Detalhes da Música: APENAS CANTOR E NOME DA MÚSICA */
    .meta-card {
      width: 100%;
      padding: 22px 26px;
      background: linear-gradient(180deg, #111116 0%, #09090c 100%);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-artist {
      font-size: 1.65rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .meta-track {
      font-size: 1.15rem;
      font-weight: 500;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-year {
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      color: #e4e4e7;
    }

    /* Tela para quando a página é aberta sem link no endereço */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: #40404a;
      padding: 60px 20px;
      text-align: center;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      fill: #222228;
    }

    .empty-state p {
      font-size: 15px;
      font-weight: 500;
      color: #52525b;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

<div class="container" id="mainContainer">

  <!-- Player Principal (Carrega automaticamente se houver link após o # na URL) -->
  <div class="player-card" id="playerCard" style="display: none;">
    <div class="video-viewport" id="viewport">
      
      <!-- Slot onde o iframe é inserido -->
      <div id="playerSlot"></div>

      <!-- Escudo Superior (Impede clicar no canal ou título) -->
      <div class="shield-top" id="shieldTop"></div>

      <!-- Escudo Inferior Direito (Cobre 'Mais vídeos' e o logo do YouTube) -->
      <div class="shield-bottom-right" id="shieldBottom">
        <button class="btn-fs" id="btnFs" type="button">⛶ Tela Cheia</button>
      </div>
    </div>

    <!-- Metadados: SOMENTE CANTOR E MÚSICA (CANAL DO CRIADOR NUNCA APARECE) -->
    <div class="meta-card" id="metaCard">
      <div class="meta-tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Cantor / Artista
      </div>
      <div class="meta-artist" id="artistDisplay">-</div>
      <div class="meta-track">
        <span id="trackDisplay">-</span>
        <span class="meta-year" id="yearDisplay" style="display: none;">-</span>
      </div>
    </div>
  </div>

  <!-- Tela quando aberta sem nenhum link na barra (Privado: ninguém consegue usar nem colar link) -->
  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
    <p>Nenhum vídeo carregado</p>
  </div>

</div>

<!-- Biblioteca HLS para links .m3u8 se necessário -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
  const playerCard = document.getElementById('playerCard');
  const emptyState = document.getElementById('emptyState');
  const viewport = document.getElementById('viewport');
  const playerSlot = document.getElementById('playerSlot');
  const artistDisplay = document.getElementById('artistDisplay');
  const trackDisplay = document.getElementById('trackDisplay');
  const yearDisplay = document.getElementById('yearDisplay');
  const btnFs = document.getElementById('btnFs');

  // Tela Cheia limpa
  btnFs.onclick = () => {
    if (!document.fullscreenElement) {
      if (viewport.requestFullscreen) viewport.requestFullscreen();
      else if (viewport.webkitRequestFullscreen) viewport.webkitRequestFullscreen();
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  };

  // Extrai ID do vídeo de qualquer link do YouTube
  function extractYouTubeId(url) {
    if (!url) return null;
    const str = url.trim();

    // 1. Caso com parâmetro v= (ex: watch?v=... com ou sem playlist &list=...)
    const vMatch = str.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (vMatch) return vMatch[1];

    // 2. Caso youtu.be/ID
    const beMatch = str.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (beMatch) return beMatch[1];

    // 3. Caso embed/ID ou shorts/ID ou /v/ID
    const embMatch = str.match(/(?:embed|shorts|\/v\/)([a-zA-Z0-9_-]{11})/);
    if (embMatch) return embMatch[1];

    // 4. Se for apenas o ID de 11 caracteres
    if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;

    return null;
  }

  // Limpa o título bruto e extrai SOMENTE o Cantor e a Música
  function parseArtistAndSong(rawTitle) {
    let title = (rawTitle || '').trim();

    title = title.replace(/^[\s\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}🎵🎶🎧🔥✨🌟🖤❤️🚂]+/gu, '').trim();
    title = title.replace(/[\s\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}🎵🎶🎧🔥✨🌟🖤❤️🚂]+$/gu, '').trim();
    title = title.replace(/^[“"']+|[”"']+$/g, '').trim();

    let artist = '';
    let track = '';
    let year = '';

    const yearMatch = title.match(/\b(19\d\d|20\d\d)\b/);
    if (yearMatch) year = yearMatch[1];

    const byMatch = title.match(/^(.+?)\s+by\s+(.+)$/i);
    const dotMatch = title.match(/^(.+?)\s+[·•]\s+(.+)$/);
    const dashMatch = title.match(/^(.+?)\s+[-–—]\s+(.+)$/);

    if (byMatch) {
      track = byMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      artist = byMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else if (dotMatch) {
      track = dotMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      artist = dotMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else if (dashMatch) {
      artist = dashMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      track = dashMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else {
      track = title;
      artist = 'Cantor / Artista';
    }

    artist = artist.replace(/^by\s+/i, '').trim();
    artist = artist.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}]/gu, '').trim();
    artist = artist.replace(/^[“"']+|[”"']+$/g, '').trim();

    track = track.replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE00}-\u{FE0F}]/gu, '').trim();
    track = track.replace(/\b(4K|RARE|HD|HQ|REMASTERED|OFFICIAL VIDEO|CLIPE OFICIAL|VÍDEO OFICIAL)\b/gi, '').trim();
    track = track.replace(/^[“"']+|[”"']+$/g, '').trim();

    return { artist, track, year };
  }

  // Reproduz o vídeo obtido diretamente do endereço da página
  async function carregarVideo(url) {
    if (!url || !url.trim()) {
      playerCard.style.display = 'none';
      emptyState.style.display = 'flex';
      return;
    }

    const cleanUrl = url.trim();
    const ytId = extractYouTubeId(cleanUrl);

    if (ytId) {
      emptyState.style.display = 'none';
      playerCard.style.display = 'block';

      // 1. Iframe oficial com sandbox rígido e proteção contra redirecionamentos
      playerSlot.innerHTML = `
        <iframe 
          src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1" 
          width="100%" 
          height="100%" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin"
          sandbox="allow-scripts allow-same-origin allow-presentation allow-forms"
          allowfullscreen>
        </iframe>
      `;

      artistDisplay.textContent = 'Carregando cantor...';
      trackDisplay.textContent = 'Carregando música...';
      yearDisplay.style.display = 'none';

      // 2. Busca dados via NoEmbed (O criador/canal é 100% ignorado!)
      try {
        const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
        if (res.ok) {
          const data = await res.json();
          if (data && data.title) {
            const info = parseArtistAndSong(data.title);
            artistDisplay.textContent = info.artist || 'Música';
            trackDisplay.textContent = info.track || data.title;
            if (info.year) {
              yearDisplay.textContent = info.year;
              yearDisplay.style.display = 'inline-block';
            } else {
              yearDisplay.style.display = 'none';
            }
            return;
          }
        }
      } catch (e) {}

      artistDisplay.textContent = 'Música';
      trackDisplay.textContent = cleanUrl;
      yearDisplay.style.display = 'none';

    } else if (cleanUrl.includes('.m3u8')) {
      emptyState.style.display = 'none';
      playerCard.style.display = 'block';
      playerSlot.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;height:100%;"></video>';
      const video = document.getElementById('videoPlayer');

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(cleanUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = cleanUrl;
      }

      artistDisplay.textContent = 'Stream de Áudio/Vídeo';
      trackDisplay.textContent = cleanUrl.split('/').pop().split('?')[0];
      yearDisplay.style.display = 'none';

    } else if (cleanUrl.includes('.mp4') || cleanUrl.includes('.mp3') || cleanUrl.includes('.webm')) {
      emptyState.style.display = 'none';
      playerCard.style.display = 'block';
      playerSlot.innerHTML = `<video src="${cleanUrl}" controls autoplay style="width:100%;height:100%;"></video>`;
      artistDisplay.textContent = 'Mídia Direta';
      trackDisplay.textContent = cleanUrl.split('/').pop().split('?')[0];
      yearDisplay.style.display = 'none';

    } else {
      playerCard.style.display = 'none';
      emptyState.style.display = 'flex';
    }
  }

  // Pega o link diretamente após o # na barra de endereços do navegador
  function lerLinkDaUrl() {
    let link = '';

    // Prioridade 1: Hash após o # (ex: .../#https://www.youtube.com/watch?v=...)
    if (window.location.hash && window.location.hash.length > 1) {
      link = decodeURIComponent(window.location.hash.substring(1));
    }

    // Prioridade 2: Parâmetro ?v= ou ?url=
    if (!link) {
      const params = new URLSearchParams(window.location.search);
      link = params.get('v') || params.get('url');
    }

    carregarVideo(link);
  }

  // Se você trocar o link na barra de endereços e der enter, ele toca automaticamente
  window.onhashchange = lerLinkDaUrl;

  // Carrega ao abrir a página
  window.onload = lerLinkDaUrl;
</script>

</body>
</html>
