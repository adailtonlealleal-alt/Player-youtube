<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player YouCine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #0a0a0c;
      --bg-card: #141419;
      --bg-input: #1e1e26;
      --accent-blue: #0a84ff;
      --accent-hover: #0070e0;
      --accent-glow: rgba(10, 132, 255, 0.4);
      --text-main: #ffffff;
      --text-muted: #9e9ea7;
      --border-color: rgba(255, 255, 255, 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 16px 50px 16px;
    }

    .container {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    /* Título idêntico à foto 2 */
    .title-box {
      text-align: center;
      margin-bottom: 2px;
    }

    .title-box h1 {
      font-size: 1.85rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #ffffff;
    }

    /* Barra de entrada de link */
    .input-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      width: 100%;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      height: 50px;
      padding: 0 18px;
      background: #ffffff;
      border: none;
      border-radius: 8px;
      color: #111111;
      font-size: 16px;
      outline: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    input[type="text"]:focus {
      box-shadow: 0 0 0 3px var(--accent-blue);
    }

    input[type="text"]::placeholder {
      color: #888888;
    }

    /* Botão azul Reproduzir igual à foto 2 */
    .btn-reproduzir {
      width: 100%;
      height: 48px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px rgba(10, 132, 255, 0.3);
    }

    .btn-reproduzir:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px var(--accent-glow);
    }

    .btn-reproduzir:active {
      transform: scale(0.99);
    }

    /* Ações rápidas (Colar / Limpar) */
    .action-chips {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .chip {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
    }

    /* Card do Vídeo - idêntico à Foto 1 */
    .player-card {
      width: 100%;
      background: #000000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 6px;
    }

    .video-viewport {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* 16:9 Aspect Ratio */
      background: #000000;
    }

    .video-viewport iframe,
    .video-viewport video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    /* Detalhes da Música: APENAS CANTOR E NOME DA MÚSICA */
    .meta-card {
      padding: 22px 26px;
      background: linear-gradient(180deg, #121216 0%, #0c0c0e 100%);
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-tag {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .meta-artist {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
      letter-spacing: -0.01em;
    }

    .meta-track {
      font-size: 1.15rem;
      font-weight: 500;
      color: #d1d5db;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .meta-year {
      font-size: 0.85rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 8px;
      border-radius: 4px;
      color: #e4e4e7;
    }

    /* Mensagem de estado inicial ou erro */
    .placeholder-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #71717a;
      gap: 12px;
      background: #09090b;
    }

    .placeholder-screen svg {
      width: 56px;
      height: 56px;
      fill: #27272a;
    }

    .placeholder-screen p {
      font-size: 15px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Cabeçalho (Estilo YouCine) -->
  <div class="title-box">
    <h1>Player YouCine - Cole o link abaixo</h1>
  </div>

  <!-- Campo para colar qualquer link -->
  <div class="input-section">
    <div class="input-row">
      <input 
        type="text" 
        id="linkInput" 
        placeholder="Cole qualquer link do YouTube aqui (ex: https://www.youtube.com/watch?v=...)"
        autocomplete="off"
        spellcheck="false"
      />
    </div>

    <!-- Botão azul Reproduzir -->
    <button class="btn-reproduzir" id="btnPlay">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Reproduzir
    </button>

    <div class="action-chips">
      <span class="chip" id="chipPaste">📋 Colar Link</span>
      <span class="chip" id="chipClear">✖ Limpar</span>
    </div>
  </div>

  <!-- Player Principal de Vídeo (Estilo Foto 1) -->
  <div class="player-card">
    <div class="video-viewport" id="viewport">
      <div class="placeholder-screen" id="placeholder">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
        <p>Cole um link do YouTube acima e clique em Reproduzir</p>
      </div>
    </div>

    <!-- Metadados: SOMENTE CANTOR E MÚSICA (CANAL DO CRIADOR NUNCA É EXIBIDO) -->
    <div class="meta-card" id="metaCard" style="display: none;">
      <div class="meta-tag">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        Cantor / Artista
      </div>
      <div class="meta-artist" id="artistDisplay">-</div>
      <div class="meta-track">
        <span id="trackDisplay">-</span>
        <span class="meta-year" id="yearDisplay" style="display: none;">-</span>
      </div>
    </div>
  </div>

</div>

<!-- Biblioteca HLS para suporte a links de streaming YouCine (.m3u8) -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
  const linkInput = document.getElementById('linkInput');
  const btnPlay = document.getElementById('btnPlay');
  const chipPaste = document.getElementById('chipPaste');
  const chipClear = document.getElementById('chipClear');

  const viewport = document.getElementById('viewport');
  const metaCard = document.getElementById('metaCard');
  const artistDisplay = document.getElementById('artistDisplay');
  const trackDisplay = document.getElementById('trackDisplay');
  const yearDisplay = document.getElementById('yearDisplay');

  // Extrai com precisão o ID do vídeo de QUALQUER link do YouTube (mesmo com erros ou duplicados)
  function extractYouTubeId(url) {
    if (!url) return null;
    const str = url.trim();

    // 1. Caso com parâmetro v= (ex: youtube.com/watch?v=... com ou sem &list=...)
    const vMatch = str.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if (vMatch) return vMatch[1];

    // 2. Caso youtu.be/ID
    const beMatch = str.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if (beMatch) return beMatch[1];

    // 3. Caso embed/ID ou shorts/ID ou /v/ID
    const embMatch = str.match(/(?:embed|shorts|\/v\/)([a-zA-Z0-9_-]{11})/);
    if (embMatch) return embMatch[1];

    // 4. Se já for apenas o ID de 11 caracteres
    if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;

    return null;
  }

  // Limpa o título bruto e extrai SOMENTE o Cantor e a Música
  function parseArtistAndSong(rawTitle) {
    let title = (rawTitle || '').trim();

    // Remove emojis e símbolos comuns de início e fim
    title = title.replace(/^[\\s\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}\\u{FE00}-\\u{FE0F}🎵🎶🎧🔥✨🌟🖤❤️🚂]+/gu, '').trim();
    title = title.replace(/[\\s\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}\\u{FE00}-\\u{FE0F}🎵🎶🎧🔥✨🌟🖤❤️🚂]+$/gu, '').trim();
    title = title.replace(/^[“"']+|[”"']+$/g, '').trim();

    let artist = '';
    let track = '';
    let year = '';

    // Extrai ano se houver (ex: 1977, 1983, 2024)
    const yearMatch = title.match(/\\b(19\\d\\d|20\\d\\d)\\b/);
    if (yearMatch) year = yearMatch[1];

    // Padrões de separação
    const byMatch = title.match(/^(.+?)\\s+by\\s+(.+)$/i);
    const dotMatch = title.match(/^(.+?)\\s+[·•]\\s+(.+)$/);
    const dashMatch = title.match(/^(.+?)\\s+[-–—]\\s+(.+)$/);

    if (byMatch) {
      track = byMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      artist = byMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else if (dotMatch) {
      track = dotMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      artist = dotMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else if (dashMatch) {
      artist = dashMatch[1].replace(/^[“"']+|[”"']+$/g, '').trim();
      track = dashMatch[2].replace(/^[“"']+|[”"']+$/g, '').trim();
    } else {
      track = title;
      artist = 'Artista';
    }

    // Limpeza final do Cantor
    artist = artist.replace(/^by\\s+/i, '').trim();
    artist = artist.replace(/[\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}\\u{FE00}-\\u{FE0F}]/gu, '').trim();
    artist = artist.replace(/^[“"']+|[”"']+$/g, '').trim();

    // Limpeza final da Música
    track = track.replace(/[\\u{1F300}-\\u{1FAFF}\\u{2600}-\\u{27BF}\\u{FE00}-\\u{FE0F}]/gu, '').trim();
    track = track.replace(/\\b(4K|RARE|HD|HQ|REMASTERED|OFFICIAL VIDEO|CLIPE OFICIAL|VÍDEO OFICIAL)\\b/gi, '').trim();
    track = track.replace(/^[“"']+|[”"']+$/g, '').trim();

    return { artist, track, year };
  }

  // Função principal para reproduzir QUALQUER link fornecido
  async function reproduzir(url) {
    if (!url || !url.trim()) {
      alert('Por favor, cole um link válido antes de clicar em Reproduzir.');
      return;
    }

    const cleanUrl = url.trim();
    const ytId = extractYouTubeId(cleanUrl);

    if (ytId) {
      // 1. YouTube Player via IFrame com referrerpolicy e nocookie (padrão oficial do YouTube)
      viewport.innerHTML = `
        <iframe 
          src="https://www.youtube-nocookie.com/embed/${ytId}?autoplay=1&rel=0&modestbranding=1&playsinline=1" 
          width="100%" 
          height="100%" 
          frameborder="0" 
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen>
        </iframe>
      `;

      // Atualiza o display indicando busca dos dados
      metaCard.style.display = 'flex';
      artistDisplay.textContent = 'Carregando cantor...';
      trackDisplay.textContent = 'Carregando música...';
      yearDisplay.style.display = 'none';

      // 2. Busca os dados via oEmbed / NoEmbed (CRIADOR DO CANAL É IGNORADO!)
      try {
        const response = await fetch(\`https://noembed.com/embed?url=https://www.youtube.com/watch?v=\${ytId}\`);
        if (response.ok) {
          const data = await response.json();
          if (data && data.title) {
            // Separa apenas Cantor e Música. O criador (data.author_name) é completamente descartado!
            const info = parseArtistAndSong(data.title);
            artistDisplay.textContent = info.artist || 'Música';
            trackDisplay.textContent = info.track || data.title;
            if (info.year) {
              yearDisplay.textContent = info.year;
              yearDisplay.style.display = 'inline-block';
            } else {
              yearDisplay.style.display = 'none';
            }
            return;
          }
        }
      } catch (err) {
        console.warn('Erro ao consultar dados da música:', err);
      }

      // Se falhar a busca do nome, exibe identificação básica
      artistDisplay.textContent = 'Música do YouTube';
      trackDisplay.textContent = 'Vídeo ID: ' + ytId;
      yearDisplay.style.display = 'none';

    } else if (cleanUrl.includes('.m3u8')) {
      // 2. Transmissão HLS YouCine (.m3u8)
      viewport.innerHTML = '<video id="videoPlayer" controls autoplay style="width:100%;height:100%;"></video>';
      const video = document.getElementById('videoPlayer');

      if (window.Hls && Hls.isSupported()) {
        const hls = new Hls();
        hls.loadSource(cleanUrl);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = cleanUrl;
      }

      metaCard.style.display = 'flex';
      artistDisplay.textContent = 'Stream YouCine (HLS)';
      trackDisplay.textContent = cleanUrl.split('/').pop().split('?')[0];
      yearDisplay.style.display = 'none';

    } else if (cleanUrl.includes('.mp4') || cleanUrl.includes('.webm') || cleanUrl.includes('.mkv')) {
      // 3. Arquivo de Vídeo Direto
      viewport.innerHTML = \`<video src="\${cleanUrl}" controls autoplay style="width:100%;height:100%;"></video>\`;
      metaCard.style.display = 'flex';
      artistDisplay.textContent = 'Vídeo Direto';
      trackDisplay.textContent = cleanUrl.split('/').pop().split('?')[0];
      yearDisplay.style.display = 'none';

    } else {
      alert('Link não reconhecido. Por favor, cole um link do YouTube (ex: https://www.youtube.com/watch?v=...) ou arquivo de vídeo.');
    }
  }

  // Inicialização: Se tiver link na URL (ex: #link ou ?v=link)
  function carregarLinkInicial() {
    let link = '';

    // Verifica hash (ex: #https://www.youtube.com/watch?v=...)
    if (window.location.hash && window.location.hash.length > 1) {
      link = decodeURIComponent(window.location.hash.substring(1));
    }

    // Verifica parâmetro de busca ?url= ou ?v=
    if (!link) {
      const params = new URLSearchParams(window.location.search);
      link = params.get('url') || params.get('v');
    }

    if (link) {
      linkInput.value = link;
      reproduzir(link);
    }
  }

  // Eventos de clique e teclado
  btnPlay.onclick = () => {
    reproduzir(linkInput.value);
  };

  linkInput.onkeydown = (e) => {
    if (e.key === 'Enter') {
      reproduzir(linkInput.value);
    }
  };

  chipPaste.onclick = async () => {
    try {
      const text = await navigator.clipboard.readText();
      if (text) {
        linkInput.value = text;
        reproduzir(text);
      }
    } catch (err) {
      linkInput.focus();
      linkInput.select();
    }
  };

  chipClear.onclick = () => {
    linkInput.value = '';
    linkInput.focus();
  };

  // Carrega ao iniciar
  carregarLinkInicial();
</script>

</body>
</html>
